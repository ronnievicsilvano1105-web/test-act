<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Multimedia Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Multimedia Page</h1>
    </header>

    <main>

        <section>
            <h2>Favorite Photos</h2>

            <img alt="photo 1" src="images/Fang Yuan.jpg">
            <img alt="photo 2" src="images/Murim Login.jpg">
            <img alt="photo 3" src="images/Mount Hua.jpg">
            <img alt="photo 4" src="images/Sect.jpg">
            <img alt="photo 5" src="images/Plum Blossom.jpg">
        </section>

        <hr>

        <section>
            <h2>Most Played Music</h2>

            <div class="media-card">
                <div>
                    <h3>All I Ever Need</h3>
                    <p>Austin Mahone</p>
                </div>
                <audio controls>
                    <source src="audios/Austin Mahone - All I Ever Need.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="media-card">
                <div>
                    <h3>Moment Of Truth</h3>
                    <p>FM Static</p>
                </div>
                <audio controls>
                    <source src="audios/FM Static - Moment Of Truth.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="media-card">
                <div>
                    <h3>First True Love</h3>
                    <p>Kolohe Kai</p>
                </div>
                <audio controls>
                    <source src="audios/Kolohe Kai - First True Love.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="media-card">
                <div>
                    <h3>Statue</h3>
                    <p>Lil Eddie</p>
                </div>
                <audio controls>
                    <source src="audios/Lil Eddie - Statue.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="media-card">
                <div>
                    <h3>Ikaw Lang</h3>
                    <p>Kiyo</p>
                </div>
                <audio controls>
                    <source src="audios/kiyo - Ikaw Lang.mp3" type="audio/mpeg">
                </audio>
            </div>

        </section>

        <hr>

        <section>
            <h2>Dream Destination</h2>

            <div class="media-card">
                <div>
                    <h3>Iceland</h3>
                </div>
                <video controls>
                    <source src="videos/Iceland.mp4" type="video/mp4">
                </video>
            </div>

            <div class="media-card">
                <div>
                    <h3>Italy</h3>
                </div>
                <video controls>
                    <source src="videos/Italy.mp4" type="video/mp4">
                </video>
            </div>

            <div class="media-card">
                <div>
                    <h3>Japan</h3>
                </div>
                <video controls>
                    <source src="videos/Japan.mp4" type="video/mp4">
                </video>
            </div>

            <div class="media-card">
                <div>
                    <h3>New Zealand</h3>
                </div>
                <video controls>
                    <source src="videos/New Zealand.mp4" type="video/mp4">
                </video>
            </div>

            <div class="media-card">
                <div>
                    <h3>Switzerland</h3>
                </div>
                <video controls>
                    <source src="videos/Switzerland.mp4" type="video/mp4">
                </video>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 My Multimedia Page</p>
    </footer>

</body>
</html>
